version: 2

models:
  - name: fct_sales
    columns:
      - name: order_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: sales_channel
        tests:
          - accepted_values:
              arguments:
                values: ["WEB", "MOBILE", "STORE", "PARTNER"]
